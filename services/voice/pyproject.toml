[project]
name = "voice"
version = "0.1.0"
description = "Phone-call voice agent (LiveKit) for the computer-use agent"
authors = [
    { name = "Davies", email = "daviesumoh000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-common",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,openai,silero]~=1.8.11",
    "livekit-plugins-noise-cancellation~=0.3.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
voice = "voice:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "worker",
]

[tool.uv.sources]
agent-common = { path = "../common", editable = true }
worker = { path = "../worker", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src:../common/src:../worker/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../common/src", "../worker/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["bitwarden_sdk", "pywebpush"]
ignore_missing_imports = true  # reached through the worker package; ships no type information
