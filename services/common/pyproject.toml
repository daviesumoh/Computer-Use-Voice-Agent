[project]
name = "agent-common"
version = "0.1.0"
description = "Code shared by the worker and voice services: request signing and API contracts"
authors = [
    { name = "Davies", email = "daviesumoh000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["uv_build>=0.6.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.9.0", "mypy>=1.14.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
