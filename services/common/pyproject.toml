[project]
name = "agent-common"
version = "0.1.0"
description = "Code shared by the worker and voice services: request signing and API contracts"
authors = [
    { name = "Davies", email = "daviesumoh000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "mypy>=2.4.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
