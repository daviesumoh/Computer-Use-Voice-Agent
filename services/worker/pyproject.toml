[project]
name = "worker"
version = "0.1.0"
description = "Background worker for the voice computer-use agent"
authors = [
    { name = "Davies", email = "daviesumoh000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-common",
    "bitwarden-sdk==2.1.0",
    "cryptography>=50.0.2",
    "dbos==3.4.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "logfire>=5.5.0",
    "openai>=3.49.0",
    "playwright>=1.65.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pywebpush>=2.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
browser-smoke = "worker.browser_smoke:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src:../common/src"

[[tool.mypy.overrides]]
module = ["bitwarden_sdk", "pywebpush"]
ignore_missing_imports = true  # these ship no type information

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../common/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: needs the local Supabase stack running (supabase start)",
  "browser: launches a real Chromium (needs `playwright install chromium`)",
  "live: calls OpenAI with WORKER_OPENAI_API_KEY and costs a few cents; run with `-m live -s`",
  "load: concurrency run against the local stack; takes a minute (run with `-m load -s`)",
]
addopts = "-m 'not live and not load'"

[tool.uv.sources]
agent-common = { path = "../common", editable = true }
